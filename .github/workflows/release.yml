# Publishing is a release, not a side effect of a push.
#
# One tag does both halves of a release, so the registry and this repository's
# Releases page cannot drift apart: the run publishes only when the version is
# new, and always records the GitHub Release. Pushing a tag for a version that is
# already on the registry therefore backfills its Release instead of failing.
#
# Two ways in for the publish half: a repository `NPM_TOKEN` secret, or npm
# trusted publishing, where npm exchanges this run's OIDC identity for a
# short-lived credential and no long-lived token exists to leak. The Release half
# needs neither — it uses the run's own GITHUB_TOKEN, which is why `contents` is
# write below.
name: release

on:
  push:
    tags: ['v*']
  # Releasing the manifest's version by hand, creating the tag when it is absent.
  workflow_dispatch:

permissions:
  # Creating the GitHub Release, and attaching the packed tarball to it.
  contents: write
  # Trusted publishing: npm accepts this run's OIDC identity in place of a token.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Empty when the secret is absent, which is what selects the second step.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          registry-url: https://registry.npmjs.org

      - name: Use an npm that knows trusted publishing
        # Pin a Node/npm pair that supports OIDC; npm latest may require a newer Node.
        run: |
          npm install --global npm@12.2.1 --ignore-scripts
          node --version
          npm --version

      - run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Offline render smoke
        run: npm run test:render
      - name: Build
        run: npm run build
      - name: Browser bundle honours the loader contract
        run: npm run verify:client
      - name: Published package would load
        run: npm run verify:package

      - name: Resolve the version, and refuse a tag that does not match it
        # A publish is not undoable, and an npm version can never be reused, so a
        # mistyped tag would burn the number permanently.
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != 'tag' ]; then
            tag="$version"
          fi
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Releasing dsh-plugin-github-issues@$version"

      - name: Pack the checked build once
        run: |
          mkdir -p "$RUNNER_TEMP/issues-release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/issues-release"
          mv "$RUNNER_TEMP/issues-release/dsh-plugin-github-issues-$VERSION.tgz" "$RUNNER_TEMP/dsh-plugin-github-issues.tgz"

      - name: Verify registry identity before publication
        id: registry
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/registry-read.npmrc
        run: |
          : > "$NPM_CONFIG_USERCONFIG"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { spawnSync } from 'node:child_process';
          import semver from 'semver';
          const name = 'dsh-plugin-github-issues', version = process.env.VERSION;
          const bytes = fs.readFileSync(process.env.RUNNER_TEMP + '/dsh-plugin-github-issues.tgz');
          const integrity = 'sha512-' + crypto.createHash('sha512').update(bytes).digest('base64');
          const view = (spec, field) => {
            const r = spawnSync('npm', ['view', spec, field, '--json', '--prefer-online'], { encoding: 'utf8', timeout: 60000 });
            if (r.error || r.signal) throw new Error('Registry query did not settle');
            if (r.status !== 0) {
              const absent = [r.stdout, r.stderr].some(text => { try { return JSON.parse(text).error?.code === 'E404' } catch { return false } });
              if (absent) return null;
              throw new Error('Registry query failed; do not treat authentication/network errors as absence');
            }
            let value = JSON.parse(r.stdout);
            if (Array.isArray(value) && value.length === 1) value = value[0];
            if (typeof value !== 'string') throw new Error('Invalid registry value');
            return value;
          };
          const existing = view(name + '@' + version, 'dist.integrity');
          if (existing !== null && existing !== integrity) throw new Error('Published bytes differ; never overwrite or relabel the version');
          const latest = view(name, 'dist-tags.latest');
          if (latest !== null && (!semver.valid(latest) || semver.gt(latest, version))) throw new Error('Refusing to downgrade or reinterpret latest');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `published=${existing !== null}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_INTEGRITY=${integrity}\n`);
          NODE

      - name: Choose the publishing credential
        # Decided from the secret itself in a shell step. setup-node exports a
        # placeholder NODE_AUTH_TOKEN once registry-url is set, so a condition that
        # reads the environment cannot tell a real secret from that placeholder.
        id: credential
        env:
          TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "Publishing with the repository's NPM_TOKEN secret."
          else
            echo "mode=trusted" >> "$GITHUB_OUTPUT"
            echo "No NPM_TOKEN secret is set; publishing through npm trusted publishing."
          fi

      - name: Publish with the repository's npm token
        if: steps.registry.outputs.published == 'false' && steps.credential.outputs.mode == 'token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$RUNNER_TEMP/dsh-plugin-github-issues.tgz" --ignore-scripts --access public --provenance

      - name: Publish through npm trusted publishing
        # No secret: npm exchanges the id-token for a credential scoped to this
        # workflow. Trusted publishing has to be configured for this package on
        # npmjs.com before the first run.
        #
        # npm prefers a configured token over the OIDC exchange, and setup-node's
        # `.npmrc` points `_authToken` at the placeholder, so this step runs against
        # an empty config: with no token to send, npm performs the exchange.
        if: steps.registry.outputs.published == 'false' && steps.credential.outputs.mode == 'trusted'
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/trusted-publishing.npmrc
        run: |
          : > "$NPM_CONFIG_USERCONFIG"
          npm publish "$RUNNER_TEMP/dsh-plugin-github-issues.tgz" --ignore-scripts --access public --provenance

      - name: Record a version that was published by hand
        if: steps.registry.outputs.published == 'true'
        run: |
          echo "dsh-plugin-github-issues@$VERSION is already on the registry." >> "$GITHUB_STEP_SUMMARY"
          echo "This run records its GitHub Release and publishes nothing." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the accepted registry tarball
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/registry-read.npmrc
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { setTimeout as wait } from 'node:timers/promises';
          const deadline = Date.now() + 600000;
          for (;;) {
            const r = spawnSync('npm', ['view', 'dsh-plugin-github-issues@' + process.env.VERSION, 'dist.integrity', '--json', '--prefer-online', '--fetch-timeout=20000', '--fetch-retries=0'], { encoding: 'utf8', timeout: 25000 });
            if (r.error || r.signal) throw new Error('Registry verification did not settle');
            if (r.status === 0) {
              let value = JSON.parse(r.stdout);
              if (Array.isArray(value) && value.length === 1) value = value[0];
              if (value !== process.env.RELEASE_INTEGRITY) throw new Error('Registry integrity differs from the checked tarball');
              break;
            }
            const absent = [r.stdout, r.stderr].some(text => { try { return JSON.parse(text).error?.code === 'E404' } catch { return false } });
            if (!absent) throw new Error('Registry verification failed');
            if (Date.now() >= deadline) throw new Error('Registry visibility deadline reached; retain this tarball for recovery');
            await wait(10000);
          }
          NODE

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "$RUNNER_TEMP/dsh-plugin-github-issues.tgz" --clobber
          else
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --generate-notes \
              "$RUNNER_TEMP/dsh-plugin-github-issues.tgz"
          fi
